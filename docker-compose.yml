services:
  meilisearch:
    image: getmeili/meilisearch:v1.33.1
    container_name: meilisearch
    networks:
      - demo
    ports:
      - "7700:7700"

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    image: openfga/openfga:v1.11.2
    container_name: migrate
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_USERNAME=postgres
      - OPENFGA_DATASTORE_PASSWORD=password
    networks:
      - demo

  openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: openfga/openfga:v1.11.2
    container_name: openfga
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_USERNAME=postgres
      - OPENFGA_DATASTORE_PASSWORD=password
      - OPENFGA_LOG_FORMAT=json
    command: run
    networks:
      - demo
    ports:
      # Needed for the http server
      - "8080:8080"
      # Needed for the grpc server (if used)
      - "8081:8081"
      # Needed for the playground (Do not enable in prod!)
      - "3000:3000"

  postgres:
    image: postgres:17
    container_name: postgres
    networks:
      - demo
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  demo: